name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb-arch: amd64
          - target: aarch64-unknown-linux-gnu
            deb-arch: arm64
            apt-arch: arm64
          - target: armv7-unknown-linux-gnueabihf
            deb-arch: armhf
            apt-arch: armhf

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cross-compilation sysroot (ARM targets)
        if: matrix.apt-arch != ''
        run: |
          APT_ARCH=${{ matrix.apt-arch }}
          sudo dpkg --add-architecture ${APT_ARCH}
          # Restrict existing sources to amd64 only (ARM packages are on ports.ubuntu.com, not the main mirror)
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          # Add the ports mirror for the ARM architecture
          sudo tee /etc/apt/sources.list.d/ports-${APT_ARCH}.list > /dev/null << EOF
          deb [arch=${APT_ARCH}] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe
          deb [arch=${APT_ARCH}] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe
          deb [arch=${APT_ARCH}] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe
          EOF
          sudo apt-get update
          sudo apt-get install -y libc6:${APT_ARCH} libgcc-s1:${APT_ARCH}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Build .deb package
        run: cargo deb --no-build --target ${{ matrix.target }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/debian/*.deb

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs/

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: debs/*.deb
          generate_release_notes: true
